<!doctype html>
<html lang="en">
  <head>
    <title>XR Blocks: Color Sorting Challenge</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #0b1020;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        max-width: min(460px, calc(100vw - 32px));
        flex-direction: column;
        gap: 4px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(12, 16, 28, 0.82);
        padding: 10px 12px;
        color: #fff;
        font-size: 14px;
        line-height: 1.35;
        pointer-events: none;
      }

      #hud span {
        color: rgba(255, 255, 255, 0.78);
      }
    </style>
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "lit": "./vendor/node_modules/lit/index.js",
          "lit/": "./vendor/node_modules/lit/",
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/",
          "xrblocks": "./vendor/xrblocks/build/xrblocks.js",
          "xrblocks/addons/": "./vendor/xrblocks/build/addons/"
        }
      }
    </script>
  </head>

  <body>
    <div id="hud">
      <strong>Move each colored cube to its matching ring.</strong>
      <span id="status">Ready</span>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
